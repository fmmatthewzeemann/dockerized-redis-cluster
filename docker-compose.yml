version: "3.8"

networks:
  backend-net:
    name: backend-network
    external: true

volumes:
  redis_data-1: { name: redis_data-1 }
  redis_data-2: { name: redis_data-2 }
  redis_data-3: { name: redis_data-3 }
  redis_data-4: { name: redis_data-4 }
  redis_data-5: { name: redis_data-5 }
  redis_data-6: { name: redis_data-6 }

x-redis-common: &redis-common
  image: redis:${REDIS_VERSION:-7-alpine}
  restart: unless-stopped
  sysctls:
    - net.core.somaxconn=65535
  networks:
    - backend-net
  extra_hosts:
    - "redis.localhost:host-gateway"
  healthcheck:
    test: ["CMD", "redis-cli", "-p", "PORT_PLACEHOLDER", "ping"]
    interval: 5s
    timeout: 3s
    retries: 5
    start_period: 10s

services:
  # Redis Cluster Nodes
  redis-1:
    <<: *redis-common
    container_name: redis-1
    hostname: redis-1
    ports:
      - "7001:7001"
      - "17001:17001"
    volumes:
      - redis_data-1:/data
    command: >
      redis-server
      --port 7001
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --appendonly yes
      --bind 0.0.0.0
      --protected-mode no
      --loglevel notice
      --cluster-announce-ip redis.localhost
      --cluster-announce-port 7001
      --cluster-announce-bus-port 17001
      --cluster-announce-hostname redis.localhost
      --cluster-preferred-endpoint-type hostname
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7001", "ping"]

  redis-2:
    <<: *redis-common
    container_name: redis-2
    hostname: redis-2
    ports:
      - "7002:7002"
      - "17002:17002"
    volumes:
      - redis_data-2:/data
    command: >
      redis-server
      --port 7002
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --appendonly yes
      --bind 0.0.0.0
      --protected-mode no
      --loglevel notice
      --cluster-announce-ip redis.localhost
      --cluster-announce-port 7002
      --cluster-announce-bus-port 17002
      --cluster-announce-hostname redis.localhost
      --cluster-preferred-endpoint-type hostname
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7002", "ping"]

  redis-3:
    <<: *redis-common
    container_name: redis-3
    hostname: redis-3
    ports:
      - "7003:7003"
      - "17003:17003"
    volumes:
      - redis_data-3:/data
    command: >
      redis-server
      --port 7003
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --appendonly yes
      --bind 0.0.0.0
      --protected-mode no
      --loglevel notice
      --cluster-announce-ip redis.localhost
      --cluster-announce-port 7003
      --cluster-announce-bus-port 17003
      --cluster-announce-hostname redis.localhost
      --cluster-preferred-endpoint-type hostname
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7003", "ping"]

  redis-4:
    <<: *redis-common
    container_name: redis-4
    hostname: redis-4
    ports:
      - "7004:7004"
      - "17004:17004"
    volumes:
      - redis_data-4:/data
    command: >
      redis-server
      --port 7004
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --appendonly yes
      --bind 0.0.0.0
      --protected-mode no
      --loglevel notice
      --cluster-announce-ip redis.localhost
      --cluster-announce-port 7004
      --cluster-announce-bus-port 17004
      --cluster-announce-hostname redis.localhost
      --cluster-preferred-endpoint-type hostname
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7004", "ping"]
    profiles: [full, replicas]

  redis-5:
    <<: *redis-common
    container_name: redis-5
    hostname: redis-5
    ports:
      - "7005:7005"
      - "17005:17005"
    volumes:
      - redis_data-5:/data
    command: >
      redis-server
      --port 7005
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --appendonly yes
      --bind 0.0.0.0
      --protected-mode no
      --loglevel notice
      --cluster-announce-ip redis.localhost
      --cluster-announce-port 7005
      --cluster-announce-bus-port 17005
      --cluster-announce-hostname redis.localhost
      --cluster-preferred-endpoint-type hostname
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7005", "ping"]
    profiles: [full, replicas]

  redis-6:
    <<: *redis-common
    container_name: redis-6
    hostname: redis-6
    ports:
      - "7006:7006"
      - "17006:17006"
    volumes:
      - redis_data-6:/data
    command: >
      redis-server
      --port 7006
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --appendonly yes
      --bind 0.0.0.0
      --protected-mode no
      --loglevel notice
      --cluster-announce-ip redis.localhost
      --cluster-announce-port 7006
      --cluster-announce-bus-port 17006
      --cluster-announce-hostname redis.localhost
      --cluster-preferred-endpoint-type hostname
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7006", "ping"]
    profiles: [full, replicas]

  cluster-init:
    image: redis:${REDIS_VERSION:-7-alpine}
    container_name: redis-cluster-init
    networks: [backend-net]
    extra_hosts:
      - "redis.localhost:host-gateway"
    depends_on:
      redis-1: {condition: service_healthy}
      redis-2: {condition: service_healthy}
      redis-3: {condition: service_healthy}
      redis-4: {condition: service_healthy, required: false}
      redis-5: {condition: service_healthy, required: false}
      redis-6: {condition: service_healthy, required: false}
    environment:
      - CLUSTER_NODES=${CLUSTER_NODES}
      - REPLICAS_PER_MASTER=${REPLICAS_PER_MASTER:-1}
    volumes:
      - ./scripts:/scripts
    command: /scripts/init-cluster.sh
    restart: "no"
    profiles: [init]
