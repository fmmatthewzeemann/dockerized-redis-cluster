spring:
  application:
    name: redis-chaos-tester
  
  data:
    redis:
      cluster:
        nodes:
          - redis.localhost:7001
          - redis.localhost:7002
          - redis.localhost:7003
          - redis.localhost:7004
          - redis.localhost:7005
          - redis.localhost:7006
        max-redirects: 3
      timeout: 5s
      jedis:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5
          max-wait: 3s
          time-between-eviction-runs: 60s

  profiles:
    active: default

server:
  port: 8080

logging:
  level:
    com.fostermoore.redis.chaos: DEBUG
    org.springframework.data.redis: INFO
    redis.clients.jedis: INFO
  pattern:
    console: '%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

redis:
  cluster:
    nodes: redis.localhost:7001,localhost:7002,redis.localhost:7003,redis.localhost:7004,redis.localhost:7005,redis.localhost:7006
    max-redirects: 3
    timeout: 5000
    pool:
      max-total: 50
      max-idle: 20
      min-idle: 5
      max-wait-millis: 3000

---
spring:
  config:
    activate:
      on-profile: test
  data:
    redis:
      cluster:
        nodes:
          - redis.localhost:7001
          - redis.localhost:7002
          - redis.localhost:7003

logging:
  level:
    com.fostermoore.redis.chaos: INFO
    redis.clients.jedis: WARN

---
spring:
  config:
    activate:
      on-profile: integration
  data:
    redis:
      cluster:
        nodes:
          - redis.localhost:7001
          - redis.localhost:7002
          - redis.localhost:7003
          - redis.localhost:7004
          - redis.localhost:7005
          - redis.localhost:7006

logging:
  level:
    com.fostermoore.redis.chaos: DEBUG